; Configuración de Modo Oscuro Exclusivo para Warcraft III World Editor Clásico
; 100% portátil: deja WorldEditPath vacío para detectar automáticamente worldedit.exe junto a WorldEditor_Dark.exe.
; Solo afecta al proceso de World Editor (NO modifica tu Windows ni archivos originales del juego).

[General]
; Vacío = autodetección automática de worldedit.exe en la misma carpeta (portátil para cualquier PC)
WorldEditPath=
; Argumentos opcionales al iniciar el editor (normalmente vacío)
Arguments=

[Colors]
; Fondo principal de ventanas, paneles, diálogos y barras (UltraDark)
BgColor=181818
; Fondo de árboles, tablas (Object Editor / Triggers) y menús
SurfaceColor=1E1E1E
; Fondo de cajas de texto y listas desplegables
InputColor=121212
; Texto principal
TextColor=EAEAEA
; Texto deshabilitado / secundario
MutedTextColor=8A8A8A
; Color de selección / elemento activo
AccentColor=264F78
; Color al pasar el ratón sobre menús o botones
HoverColor=2E2E32
; Bordes y líneas separadoras
BorderColor=383838
